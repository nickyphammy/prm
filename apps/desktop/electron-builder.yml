appId: com.nickpham.prm
productName: PRM Dashboard
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
mac:
  category: public.app-category.productivity
  target:
    - dmg
  # Signing + notarization are configured later, before selling (needs an Apple Developer ID).
  identity: null
win:
  target:
    - nsis
linux:
  target:
    - AppImage
# better-sqlite3 ships Node-API prebuilds that load in Electron as-is, so no native rebuild is needed.
npmRebuild: false
